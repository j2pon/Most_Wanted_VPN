# DXVK Configuration for Need for Speed: Most Wanted
# Synchronize with 144Hz monitor for perfectly smooth frame pacing & zero Discord stutter
dxvk.frameRate = 144
d3d9.presentInterval = 1
dxgi.syncInterval = 1

# Low latency mode (prevents input lag and frame queue buildup)
d3d9.maxFrameLatency = 1

# Surface and flip presentation optimizations (Discord and OBS capture compatibility)
d3d9.deferSurfaceCreation = True
d3d9.supportDiscard = True
d3d9.allowDiscard = True

# Multithreaded shader compilation matching 6 physical cores (Intel i5-10600)
dxvk.numCompilerThreads = 6

# Texture filtering quality (Crisp road surfaces and textures at distance - Remastered clarity)
d3d9.samplerAnisotropy = 16

